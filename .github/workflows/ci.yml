name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test against real PostgreSQL
        run: >-
          dotnet test --solution IncidentDesk.sln --no-restore --configuration Release
          --report-trx --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
      - name: Start the packaged application
        env:
          POSTGRES_PASSWORD: ci-only-incidentdesk-database
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test the Docker application
        run: python3 scripts/smoke.py
      - name: Verify container startup orchestration
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke test the production demo configuration
        env:
          POSTGRES_PASSWORD: ci-only-incidentdesk-database
        run: |
          cat > "$RUNNER_TEMP/incidentdesk-production.yaml" <<'YAML'
          services:
            migrate:
              environment:
                ASPNETCORE_ENVIRONMENT: Production
                Demo__Enabled: "true"
                DataProtection__PersistToDatabase: "true"
            api:
              environment:
                ASPNETCORE_ENVIRONMENT: Production
                Demo__Enabled: "true"
                Docs__Enabled: "true"
                INCIDENTDESK_BOOTSTRAP_DEMO: "true"
                DataProtection__PersistToDatabase: "true"
          YAML
          docker compose -f compose.yaml -f "$RUNNER_TEMP/incidentdesk-production.yaml" up --detach --force-recreate --wait --wait-timeout 180
          python3 scripts/smoke.py
      - name: Show container logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-only-incidentdesk-database
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-incidentdesk-database
        run: docker compose down --volumes
